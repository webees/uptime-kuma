name: 🧭 Deploy Drift

on:
  # After every publish finishes, not on the push itself: the release and the
  # machine move separately, so a check racing the deploy sees the new release
  # next to the old machine and calls a healthy deploy unreadable (observed on
  # the first main run, which it also cancelled). Daily catches a hand deploy.
  schedule:
    - cron: '41 5 * * *'
  workflow_run:
    workflows: ["🐳 Docker (Multi-Arch)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Sequencing comes from `workflow_run`; this group only orders the checks.
  # A second one is queued rather than dropped, because the later state is the
  # one worth reporting.
  group: deploy-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A cancelled or skipped publish still leaves a readable pair; only a run
    # that never started has nothing to say.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'skipped'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `workflow_run` runs on the default branch; the check must read the
          # commit that was just published, not whatever HEAD is by then.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Same pinned GitHub release as the deploy job: the setup action resolves
      # `latest` through Fly itself, which is the service under test here.
      - name: 🛫 Install pinned flyctl
        env:
          FLYCTL_VERSION: 0.5.1
          FLYCTL_SHA256: 47803bc5dc3eb7c7a45626ff76f0082e8c5b5fb8b805efbe00469d04757e1b1b
          FLYCTL_ASSET: flyctl_0.5.1_Linux_x86_64.tar.gz
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${FLYCTL_ASSET}"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$tmp/$FLYCTL_ASSET" "$url"
          printf '%s  %s\n' "$FLYCTL_SHA256" "$tmp/$FLYCTL_ASSET" | sha256sum -c -
          tar -xzf "$tmp/$FLYCTL_ASSET" -C "$tmp" flyctl
          install -m 0755 "$tmp/flyctl" /usr/local/bin/flyctl
          flyctl version

      # `latest` is ours and public; a token is only needed for the app reads.
      - name: 🔐 Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧭 Compare production with the promoted image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?repository secret FLY_API_TOKEN is required}"
          app="$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)"
          test -n "$app"
          out="$RUNNER_TEMP/drift"
          mkdir -p "$out"
          # Every read is bounded and every read failing aborts: "cannot tell"
          # must never be reported as "in sync".
          timeout 60 flyctl releases -a "$app" --json > "$out/releases.json"
          timeout 60 flyctl status -a "$app" --json > "$out/status.json"
          timeout 120 docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:latest" --raw > "$out/latest.json"
          python3 scripts/deploy_drift.py \
            "$out/releases.json" "$out/status.json" "$out/latest.json"
