name: 🐳 Docker (Multi-Arch)

on:
  workflow_dispatch:
    inputs:
      # `force` skips the rebuild probe and publishes unconditionally, which is
      # what a manual run normally wants. `probe` runs the scheduled decision,
      # so the skip path stays exercisable between Mondays.
      mode:
        description: "Rebuild decision"
        type: choice
        default: force
        options:
          - force
          - probe
  # Weekly rebuild so base-image and OS-package security fixes ship without a
  # code change. Scheduled runs use `main` HEAD and go through the same
  # validate -> build -> deploy chain; only PR-only steps are skipped.
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches:
      - main
    tags: [ '*' ]
    # A docs or test edit cannot change the image, yet it still queued a full
    # build and a production deploy. Everything listed here is either excluded
    # from the build context by `.dockerignore` or is CI-only. `Dockerfile`,
    # `config/**`, `scripts/entrypoint*`, `scripts/restic.sh`, `scripts/
    # services.sh` and `.dockerignore` must stay deployable, and tag pushes are
    # never path-filtered, so releases still publish.
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - docs/**
      - tests/**
      - scripts/rebuild.sh
      - scripts/round_open.py
      - scripts/deploy_drift.py
      - scripts/branch_rule.py
      - scripts/pr_matrix.py
      - scripts/check_schedules.py
      - scripts/upstream_deps.py
      - scripts/validate_action_pin_update.py

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ghcr-registry
  cancel-in-progress: false

jobs:
  # A weekly cron rebuilds unconditionally, so a fleet that is already current
  # still spends a full build and a deploy every week. Probe the published
  # image first and only continue when it reports pending upgrades. Every other
  # event is a real change and passes without probing.
  rebuild_check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Log into registry ${{ env.REGISTRY }}
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🤔 Decide whether the scheduled rebuild is needed
        id: decision
        env:
          MODE: ${{ inputs.mode || 'force' }}
        run: |
          set -euo pipefail
          needed=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] ||
            { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$MODE" = probe ]; }; then
            needed=false
            out="$(DEPS_DOCKER_TIMEOUT=300 scripts/rebuild.sh count "${REGISTRY}/${IMAGE_NAME}:latest")"
            printf '%s\n' "$out"
            count="$(printf '%s\n' "$out" | sed -n 's/^upgradable packages: //p' | tail -n 1)"
            [[ "$count" =~ ^[0-9]+$ ]] || {
              echo "::error::published package count is missing or malformed" >&2
              exit 1
            }
            if [ "$count" -ne 0 ]; then
              needed=true
            fi
            echo "published package upgrades: ${count}"
          fi
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"

  # Nothing is published from a commit that failed its own gates.
  validate:
    uses: ./.github/workflows/validate.yml
    secrets: inherit
    # A called workflow cannot grant itself more than the caller holds: asking
    # for `pull-requests: read` inside validate.yml made every publish die with
    # `startup_failure` (run 41080321915) while the PR-only run stayed green.
    permissions:
      contents: read
      pull-requests: read

  build:
    needs: [rebuild_check, validate]
    if: needs.rebuild_check.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Enable QEMU for cross-platform builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          use: true

      - name: 🔐 Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: 🚀 Build and push Docker image (Multi-Arch)
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Attestations ride along as extra index entries; the digest step
          # below still selects the plain linux/amd64 image manifest.
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag is mutable; the deployment must name the exact amd64 manifest.
      - name: 🔖 Record the published amd64 digest
        id: digest
        if: github.event_name != 'pull_request'
        env:
          TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Provenance adds attestation entries to the same index, so the
          # platform filter is what keeps `--image` on a real image manifest:
          # take the single linux/amd64 child and refuse anything else.
          digest="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TAG}" \
            --format '{{range .Manifest.Manifests}}{{if and (eq .Platform.Architecture "amd64") (eq .Platform.OS "linux")}}{{.Digest}}{{"\n"}}{{end}}{{end}}' \
            | sed '/^$/d')"
          [ "$(printf '%s\n' "$digest" | wc -l)" -eq 1 ]
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          echo "Published ${REGISTRY}/${IMAGE_NAME}:${TAG}@${digest}"

      - name: 🚦 Smoke test the published digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: python3 tests/runtime_smoke.py "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      # fly.toml carries no image, so the digest is the only source of truth.
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action resolves `latest` through a Fly-hosted release manifest, so a
      # control-plane 503 there fails the job before any retry can run (observed:
      # run 40959357266, deploy died in this step). The tarball comes from the
      # GitHub release instead and is pinned by sha256, so the toolchain no
      # longer depends on the service it is about to touch.
      - name: 🛫 Install pinned flyctl
        env:
          FLYCTL_VERSION: 0.5.1
          FLYCTL_SHA256: 47803bc5dc3eb7c7a45626ff76f0082e8c5b5fb8b805efbe00469d04757e1b1b
          FLYCTL_ASSET: flyctl_0.5.1_Linux_x86_64.tar.gz
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${FLYCTL_ASSET}"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$tmp/$FLYCTL_ASSET" "$url"
          printf '%s  %s\n' "$FLYCTL_SHA256" "$tmp/$FLYCTL_ASSET" | sha256sum -c -
          tar -xzf "$tmp/$FLYCTL_ASSET" -C "$tmp" flyctl
          install -m 0755 "$tmp/flyctl" /usr/local/bin/flyctl
          flyctl version

      # Registry login is only needed for the promotion below, not for the
      # deploy itself, so it stays in front of the step that pushes.
      # `imagetools` is part of buildx; set up the same pinned action the build
      # job uses instead of assuming a runner-local plugin version.
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          use: true

      - name: 🔐 Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Deploy the exact digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?repository secret FLY_API_TOKEN is required}"
          : "${EXPECTED_IMAGE:?the built image digest is missing}"
          # Name the app explicitly: `fly.toml` is authoritative, but a stale
          # local default must never redirect the deploy to another app.
          app="$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)"
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
          # Fly's control plane intermittently answers 5xx on the release path
          # (observed twice: `failed to create release (status 503)`). Retry
          # only that class with backoff; the same digest makes it idempotent,
          # and anything else fails immediately instead of being masked.
          attempt=1
          while :; do
            if flyctl deploy -a "$app" --image "$EXPECTED_IMAGE" --yes \
              2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
              break
            fi
            status="${PIPESTATUS[0]}"
            if [ "$attempt" -ge 3 ] ||
              ! grep -qE 'status (502|503|504)|Service Unavailable' "$RUNNER_TEMP/deploy.log"; then
              echo "::error::deploy failed (attempt $attempt, exit $status) without a transient upstream error" >&2
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "transient Fly error on attempt $attempt; retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      # A successful deploy is not readiness: verify the release, the digest on
      # every machine and the passing health check.
      - name: ✅ Verify the deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${APP:?the app name was not resolved}"
          deadline=$((SECONDS + 300))
          while :; do
            if releases="$(timeout 30 flyctl releases -a "$APP" --json)" &&
              status="$(timeout 30 flyctl status -a "$APP" --json)" &&
              jq -e --arg image "$EXPECTED_IMAGE" '
                ((if type == "array" then sort_by(.Version) | last else empty end) as $latest
                 | ($latest != null) and ($latest.ImageRef == $image)
                   and (($latest.Status // "" | ascii_downcase) == "complete"))
              ' <<< "$releases" >/dev/null &&
              jq -e --arg image "$EXPECTED_IMAGE" '
                ((.Status // "" | ascii_downcase) == "deployed")
                and ((.Machines | length) > 0)
                and all(.Machines[];
                  ((.state // "" | ascii_downcase) == "started")
                  and ((.host_status // "" | ascii_downcase) == "ok")
                  and (((.image_ref.registry // "") + "/"
                        + (.image_ref.repository // "") + "@"
                        + (.image_ref.digest // "")) == $image)
                  and ((.checks | length) > 0)
                  and all(.checks[]; ((.status // "" | ascii_downcase) == "passing")))
              ' <<< "$status" >/dev/null
            then
              echo "deployment verified: ${EXPECTED_IMAGE}"
              exit 0
            fi
            [ "$SECONDS" -ge "$deadline" ] && break
            sleep 5
          done
          echo "::error::deployment verification failed" >&2
          exit 1

      # `latest` is what a human or a `fly deploy` without `--image` picks up,
      # so it must never move ahead of the gates. The build metadata publishes
      # only the run tag; this step promotes that exact index after the digest
      # smoke test and the deployment verification have both passed.
      - name: ⬆️ Promote the verified image to latest
        env:
          AMD64_DIGEST: ${{ needs.build.outputs.digest }}
          TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker buildx version
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::verified amd64 digest is missing or malformed" >&2
            exit 1
          }
          image="${REGISTRY}/${IMAGE_NAME}"
          # The run tag is the only reference carrying the attestations, so the
          # index digest is read from it and its amd64 child must be the digest
          # that was smoke-tested and deployed.
          index_digest="$(timeout 120 docker buildx imagetools inspect "${image}:${TAG}" \
            --format '{{.Manifest.Digest}}')"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::published index digest is missing or malformed" >&2
            exit 1
          }
          index_amd64="$(timeout 120 docker buildx imagetools inspect "${image}:${TAG}" \
            --format '{{range .Manifest.Manifests}}{{if and (eq .Platform.Architecture "amd64") (eq .Platform.OS "linux")}}{{.Digest}}{{end}}{{end}}')"
          if [ "$index_amd64" != "$AMD64_DIGEST" ]; then
            echo "::error::the run tag no longer carries the verified amd64 digest" >&2
            exit 1
          fi
          timeout 120 docker buildx imagetools create \
            --tag "${image}:latest" "${image}@${index_digest}"
          # Retagging is not promotion: re-read `latest` and prove both the
          # index and its amd64 child still name the verified build.
          latest_index="$(timeout 120 docker buildx imagetools inspect "${image}:latest" \
            --format '{{.Manifest.Digest}}')"
          latest_amd64="$(timeout 120 docker buildx imagetools inspect "${image}:latest" \
            --format '{{range .Manifest.Manifests}}{{if and (eq .Platform.Architecture "amd64") (eq .Platform.OS "linux")}}{{.Digest}}{{end}}{{end}}')"
          if [ "$latest_index" != "$index_digest" ] || [ "$latest_amd64" != "$AMD64_DIGEST" ]; then
            echo "::error::latest does not reference the verified image" >&2
            exit 1
          fi
          echo "promoted ${image}:latest -> ${index_digest} (amd64 ${AMD64_DIGEST})"

  notify-failure:
    needs: [rebuild_check, validate, build, deploy]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🚨 Notify publish failure
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.ALERT_WEBHOOK_URL }}
          workflow: ${{ github.workflow }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          conclusion: failure
          reason: Image validation, build, digest smoke test, deploy, or verification failed.
