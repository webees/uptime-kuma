# The real Fly application. CI deploys into whatever app is named here, so a
# rename must be synced across this file, the README record and the deploy
# token scope in the same commit; `tests/test_recurring_gate.py` pins the pair.
app = "bxx-uptime-kuma"
kill_signal = "SIGINT"
kill_timeout = "10s"
primary_region = "sin"
swap_size_mb = 256

# No `[build].image` on purpose: a mutable tag here is a second source of truth
# that silently goes stale. The deploy workflow passes the exact amd64 digest
# that validate passed; running `fly deploy` by hand builds this Dockerfile.

[checks.health]
grace_period = "1m0s"
interval = "30s"
method = "get"
# Caddy answers this itself, so the probe survives a dead uptime-kuma and is
# never subject to the CADDY_DOMAINS gate.
path = "/health"
# Must match the Caddyfile listener; Caddy is unprivileged, so not 80.
port = 8080
timeout = "5s"
type = "http"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
# Must match the Caddyfile listener. Port 80 fails with EACCES on Fly.
internal_port = 8080
min_machines_running = 1

  [http_service.concurrency]
  hard_limit = 150
  soft_limit = 100
  type = "requests"

[[mounts]]
destination = "/app/data"
source = "app_data"
